server:
  port: 7491
  address: 0.0.0.0
  http2:
    enabled: false

plugins:
  youtube:
    enabled: true
    oauth:
      # Burner account — TV playback needs sign-in. Ban risk.
      enabled: true
      refreshToken: 1//05eVJMrhyUcq2CgYIARAAGAUSNwF-L9Ir3gEa6DSFX0YleFRB0OjyNolItThNkeWsBx6MN0D0_Pws4kacKMQsxTSHZZatAeaxx5k
      skipInitialization: true
    # Required: Lavalink's built-in sig decryption is broken.
    remoteCipher:
      url: https://cipher.kikkia.dev/
      userAgent: aura-musicbot-node1
    # Required: without PoT, TV falls back to itag18.
    remotePot:
      url: https://pot.ashtongg.me
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV is the only playback client — datacenter IPs are gated on all others.
    clients:
      - WEB
      - MWEB
      - TV
      - TVHTML5_SIMPLY
      - ANDROID_MUSIC
      - IOS
      - WEBEMBEDDED
      - MUSIC
      - ANDROID_VR
    clientOptions:
      MWEB:
        playback: false
        playlistLoading: true
        videoLoading: true
        searching: true
      WEB:
        playback: false
        playlistLoading: true
        videoLoading: true
        searching: true
      IOS:
        playback: false
        playlistLoading: true
        videoLoading: true
        searching: true
      ANDROID_VR:
        playback: false
        playlistLoading: true
        videoLoading: true
        searching: true
      ANDROID_MUSIC:
        playback: false
        playlistLoading: false
        videoLoading: true
        searching: true
      WEBEMBEDDED:
        playback: false
        playlistLoading: false
        videoLoading: true
        searching: false
      TVHTML5_SIMPLY:
        playback: false
        playlistLoading: false
        videoLoading: true
        searching: true
      # Search only (reports as WEB_REMIX) — bot uses ytmsearch.
      MUSIC:
        playback: false
        playlistLoading: false
        videoLoading: false
        searching: true
      # The ONLY playback client — needs the OAuth account above.
      TV:
        playback: true
        playlistLoading: false
        videoLoading: true
        searching: false

  lavasearch:
    sources:
      - spotify
      - youtube

  lavasrc:
    # First match wins.
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      # Off: SlugYZeon provides the "spotify" source. Both on = collision.
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: true
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
      yandexmusic: false
      vkmusic: false
      lrcLib: false
    spotify:
      # Blank on purpose — SlugYZeon uses anonymous tokens, not app credentials.
      clientId:
      clientSecret:
      countryCode: US
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      # Must stay false: no "local" source enabled.
      localFiles: false
      # Must stay false: nothing listens on the custom token endpoint.
      preferAnonymousToken: false
    applemusic:
      countryCode: US
      playlistLoadLimit: 3
      albumLoadLimit: 3
    deezer:
      formats: [ FLAC, MP3_320, MP3_256, MP3_128, MP3_64, AAC_64 ]
    yandexmusic:
      playlistLoadLimit: 1
      albumLoadLimit: 1
      artistLoadLimit: 1
    flowerytts:
      voice: Olivia
      translate: false
      silence: 0
      speed: 1.0
      audioFormat: mp3
    youtube:
      countryCode: US
      language: en
    vkmusic:
      playlistLoadLimit: 1
      artistLoadLimit: 1
      recommendationsLoadLimit: 10
    tidal:
      countryCode: US
      searchLimit: 6
    qobuz: {}
    ytdlp:
      path: yt-dlp
      searchLimit: 10
    jiosaavn:
      decryption:
        algorithm: DES
        transformation: DES/ECB/PKCS5Padding

  slugyzeon:
    sources:
      # Default is false — this line enables the Spotify source.
      spotify: true
      amazonmusic: false
      gaana: false
      pandora: false
      youtube: false
    spotify:
      countryCode: US
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true
      localFiles: false
    # Do not delete: plugin default has no ytmsearch, which the bot needs.
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

lavalink:
  plugins:
    - dependency: com.github.xylen-py.SlugYZeon:slugyzeon-plugin:4.6.2
      repository: https://jitpack.io
    # topi314 publishes to JitPack only — maven.lavalink.dev 404s.
    - dependency: com.github.topi314.lavasrc:lavasrc-plugin:4.8.3
      repository: "https://jitpack.io"
      snapshot: false
    - dependency: com.github.topi314.lavasearch:lavasearch-plugin:1.0.0
      repository: "https://jitpack.io"
      snapshot: false
  pluginsDir: './plugins'
  server:
    # Must match NODE_PASSWORD in the bot's .env.
    password: sandesh11
    sources:
      youtube: false # youtube-source plugin replaces the built-in
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    # Fewer allocations = fewer GC pauses = fewer underruns.
    nonAllocatingFrameBuffer: true
    # Headroom for GC pauses. 225ms underran, 400ms stuttered, 800ms is stable.
    bufferDurationMs: 800
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    gc-warnings: true
    # 10s: the remote cipher call is an extra round trip on the playback path.
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 10000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: true
    includeClientInfo: true
    # FALSE: would write the OAuth header to disk in plaintext.
    includeHeaders: false
    includeQueryString: true
    # FALSE: would write the refresh token and client secret to disk.
    includePayload: false
    maxPayloadLength: 1000
  logback:
    # Key must stay lowercase — Spring ignores "rollingPolicy".
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
